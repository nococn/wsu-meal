<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>우송대 학식</title>
  <meta name="description" content="우송대학교 학생식당·기숙사 식단을 날짜별로 확인하세요." />
  <meta name="theme-color" content="#2b6bf3" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="stylesheet" href="style.css" />
  <script>
    // 저장해 둔 테마를 그리기 전에 적용 (밝은 화면이 잠깐 번쩍이지 않게)
    try {
      if (localStorage.getItem('wsu-meal:theme') === 'dark') document.documentElement.dataset.theme = 'dark'
    } catch {}
  </script>
</head>
<body>
  <main class="page">
    <header class="intro">
      <p class="eyebrow">우송대학교 학식</p>
      <h1 class="h1">오늘 뭐 먹지?</h1>
      <p class="lead">실제 메뉴와 다를 수 있어요.</p>
      <div class="dates" id="dates" role="group" aria-label="날짜"></div>
    </header>

    <section class="section">
      <div class="tabs" id="tabs" role="tablist" aria-label="식당"></div>
      <div id="content" aria-live="polite">
        <div class="skeleton" aria-busy="true" aria-label="식단을 불러오는 중"></div>
      </div>
      <p class="source" id="source"></p>
    </section>
  </main>

  <footer class="footer">
    <p>출처: <a href="https://www.wsu.ac.kr/page/index.jsp?code=campus0806" rel="noopener" target="_blank">우송대학교 홈페이지 학생식당 안내</a></p>
    <p>데이터: <a href="https://github.com/sangukjeon/wsu-meal-api" rel="noopener" target="_blank">wsu-meal-api</a></p>
    <p>우송대학교의 공식 서비스가 아닙니다.</p>
  </footer>

  <div class="fabs">
    <button type="button" class="fab" id="theme" aria-label="다크 모드로 바꾸기">
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
    <button type="button" class="fab" id="refresh" aria-label="새로고침">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg>
    </button>
  </div>

  <script src="app.js"></script>
</body>
</html>
